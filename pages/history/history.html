<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shifts</title>
  <link rel="stylesheet" href="history.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231b263b'/><text x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='900' font-size='16' fill='white'>RP</text></svg>">
</head>
<body>
<a href="#main-content" class="skip-nav">Skip to main content</a>

  <!-- ── HEADER ── -->
  <header class="site-header">
    <div class="header-brand">
      <div class="brand-icon">RP</div>
      <div>
        <div class="brand-title">My Shifts</div>
        <div class="brand-sub" id="welcomeMessage"></div>
      </div>
    </div>
    <div class="fuel-prices">
      <p>ESSENCE: <span id="pmsPrice">—</span></p>
      <p>MAZOUT: <span id="agoPrice">—</span></p>
      <p id="headerStationName" style="display:none;"></p>
    </div>
  </header>

  <!-- ── MAIN ── -->
  <main id="main-content" class="history-main">

    <div class="history-card">
      <div class="history-card-title">Recent Shifts</div>
      <p class="history-hint">Your last 50 submitted shifts, most recent first.</p>

      <div class="history-table-wrap">
        <div class="history-thead">
          <span>Date</span>
          <span>Shift</span>
          <span class="align-right">Total Vente</span>
          <span class="align-right">Total Payments</span>
          <span class="align-right">Gain / Loss</span>
        </div>
        <div id="historyList"><div class="history-empty">Loading…</div></div>
      </div>
    </div>

  </main>

  <footer>
    <a href="/testing_projects/root/index" class="btn-back">← Back to Form</a>
    <button class="action-btn btn-logout" onclick="openDialog('confirmLogoutPopup')">Log Out</button>
  </footer>

  <!-- ── LOGOUT POPUP ── -->
  <div class="popup" id="confirmLogoutPopup" role="dialog" aria-modal="true" aria-labelledby="dlg-logout-title" aria-hidden="true" style="display:none;">
    <div class="popup-content">
      <p class="popup-title" id="dlg-logout-title">Log Out?</p>
      <p class="popup-sub">Any unsaved data will be lost.</p>
      <button id="confirmLogout" onclick="closeDialog('confirmLogoutPopup'); this.disabled=true; logout().finally(()=>this.disabled=false)">Log Out</button>
      <button id="cancelLogout" onclick="closeDialog('confirmLogoutPopup')">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
  <script src="../../utils/config.js"></script>
  <script src="history.js"></script>
  <script type="module" src="../../utils/utils.js"></script>
</body>
</html>
