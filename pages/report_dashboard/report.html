<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Report Dashboard</title>
  <link rel="stylesheet" href="report.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231b263b'/><text x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='900' font-size='16' fill='white'>RP</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
</head>
<body>
<a href="#main-content" class="skip-nav">Skip to main content</a>

  <!-- ── HEADER ── -->
  <header class="site-header">
    <div class="header-brand">
      <div class="brand-icon">RP</div>
      <div>
        <div class="brand-title">Report Dashboard</div>
        <div class="brand-sub" id="welcomeMessage"></div>
      </div>
    </div>
    <div class="fuel-prices">
      <p>ESSENCE: <span id="pmsPrice">—</span></p>
      <p>MAZOUT: <span id="agoPrice">—</span></p>
    </div>
  </header>

  <!-- ── NAV ── -->
  <nav>
    <ul>
      <li><a href="../situation/situation">Situation</a></li>
      <li><a href="../stock/stock">Stock</a></li>
      <li class="dropdown">
        <a href="#" aria-haspopup="true" aria-expanded="false">Employees</a>
        <ul class="dropdown-menu">
          <li><a href="../employeeCheck/logsDetail">Employee Reports</a></li>
        </ul>
      </li>
      <li><a href="report" class="active" aria-current="page">Dashboard</a></li>
      <li><a href="../settings/settings">Settings</a></li>
    </ul>
  </nav>

  <div class="app">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-text">
          <h1>Reports</h1>
          <p>Choose a report</p>
        </div>
      </div>
      <div class="reports-list" id="reportsList"></div>
      <div class="sidebar-footer">
        <small>© 2025 My Dashboard</small>
      </div>
    </aside>

    <!-- ── MAIN ── -->
    <main class="main" id="main-content">

      <!-- Metric cards -->
      <section class="metrics">
        <div class="metric"><h3>Gain PMS</h3><p id="gainPms">—</p></div>
        <div class="metric"><h3>Gain AGO</h3><p id="gainAgo">—</p></div>
        <div class="metric"><h3>Total Gain</h3><p id="gain">—</p></div>
      </section>

      <section class="content">
        <div class="panel table-panel">

          <!-- Table title + result count -->
          <div class="table-header-row">
            <h4 id="tableTitle">Select a report</h4>
            <span class="result-count" id="resultCount"></span>
          </div>

          <div class="table-wrap">

            <!-- Search controls -->
            <div class="controls">
              <div class="control-group">
                <label for="searchWith">Search By</label>
                <select id="searchWith"></select>
              </div>
              <div class="control-group control-search">
                <label for="search">Search</label>
                <div class="search-input-wrap">
                  <input id="search" class="table-search" placeholder="Type to filter…" autocomplete="off" list="searchSuggestions"/>
                  <datalist id="searchSuggestions"></datalist>
                </div>
              </div>
            </div>

            <!-- Table -->
            <table class="indices-table">
              <thead><tr id="headers"></tr></thead>
              <tbody id="body"></tbody>
            </table>

            <!-- Pagination -->
            <div id="pagination">
              <button id="prevPage">Previous</button>
              <span id="pageNumber">Page 1 of 1</span>
              <button id="nextPage">Next</button>
            </div>

          </div><!-- /table-wrap -->
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
  <script src="../../utils/config.js"></script>
  <script src="report.js"></script>
  <script type="module" src="../../utils/utils.js"></script>
</body>
</html>
