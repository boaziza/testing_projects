<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock</title>
    <link rel="stylesheet" href="stock.css">
</head>
<body>
<a href="#main-content" class="skip-nav">Skip to main content</a>

    <!-- ── HEADER ── -->
    <header class="site-header">
        <div class="header-brand">
            <div class="brand-icon">RP</div>
            <div>
                <div class="brand-title">Stock Management</div>
                <div class="brand-sub" id="welcomeMessage"></div>
            </div>
        </div>
        <div class="fuel-prices">
            <p>ESSENCE: <span id="pmsPrice">—</span></p>
            <p>MAZOUT: <span id="agoPrice">—</span></p>
        </div>
    </header>

    <!-- ── NAV ── -->
    <nav>
      <ul>
        <li><a href="../situation/situation">Situation</a></li>
        <li><a href="stock" class="active" aria-current="page">Stock</a></li>
        <li class="dropdown">
          <a href="#" aria-haspopup="true" aria-expanded="false">Employees</a>
          <ul class="dropdown-menu">
            <li><a href="../employeeCheck/logsDetail">Employee Reports</a></li>
          </ul>
        </li>
        <li><a href="../report_dashboard/report">Dashboard</a></li>
        <li><a href="../settings/settings">Settings</a></li>
      </ul>
    </nav>

    <!-- ── STOCK FORM ── -->
    <div class="stock-wrapper" id="main-content">

        <form action="" id="stockForm">

            <div class="stock-date-bar">
                <label for="logDate">Date</label>
                <input type="date" name="logDate" id="logDate">
            </div>

            <div class="fuel-sections">

                <!-- ESSENCE / PMS -->
                <div class="fuel-section pms-section">
                    <div class="fuel-section-title pms-title">Essence (PMS)</div>

                    <div class="stock-field">
                        <label for="initialPms">Jauge Debut (L)</label>
                        <input type="number" name="initialPms" id="initialPms">
                    </div>
                    <div class="stock-field">
                        <label>Ventes Litres</label>
                        <span class="output" id="venteLitresPms">—</span>
                    </div>
                    <div class="stock-field">
                        <label for="receivedPms">Received (L)</label>
                        <input type="number" name="receivedPms" id="receivedPms">
                    </div>
                    <div class="stock-field">
                        <label for="physicalStockPms">Physical Stock (L)</label>
                        <input type="number" name="physicalStockPms" id="physicalStockPms">
                    </div>
                    <div class="stock-field">
                        <label>Theory Stock (L)</label>
                        <span class="output" id="theoryStockPms">—</span>
                    </div>
                    <div class="stock-field gain-field">
                        <label>Gain / Loss (L)</label>
                        <span class="output gain-value" id="gainFuelPms">—</span>
                    </div>
                </div>

                <!-- MAZOUT / AGO -->
                <div class="fuel-section ago-section">
                    <div class="fuel-section-title ago-title">Mazout (AGO)</div>

                    <div class="stock-field">
                        <label for="initialAgo">Jauge Debut (L)</label>
                        <input type="number" name="initialAgo" id="initialAgo">
                    </div>
                    <div class="stock-field">
                        <label>Ventes Litres</label>
                        <span class="output" id="venteLitresAgo">—</span>
                    </div>
                    <div class="stock-field">
                        <label for="receivedAgo">Received (L)</label>
                        <input type="number" name="receivedAgo" id="receivedAgo">
                    </div>
                    <div class="stock-field">
                        <label for="physicalStockAgo">Physical Stock (L)</label>
                        <input type="number" name="physicalStockAgo" id="physicalStockAgo">
                    </div>
                    <div class="stock-field">
                        <label>Theory Stock (L)</label>
                        <span class="output" id="theoryStockAgo">—</span>
                    </div>
                    <div class="stock-field gain-field">
                        <label>Gain / Loss (L)</label>
                        <span class="output gain-value" id="gainFuelAgo">—</span>
                    </div>
                </div>

            </div><!-- /fuel-sections -->

        </form>

        <div class="stock-actions">
            <button class="action-btn" type="button" onclick="this.disabled=true; stock().finally(() => this.disabled=false)">Calculate Stock</button>
            <button class="action-btn btn-store" onclick="openDialog('confirmStorePopup')">Store Stock</button>
            <button class="action-btn btn-secondary" onclick="this.disabled=true; download().finally(() => this.disabled=false)">Download PDF</button>
        </div>

    </div><!-- /stock-wrapper -->

    <footer>
        <button class="action-btn btn-logout" onclick="openDialog('confirmLogoutPopup')">Log Out</button>
    </footer>

    <!-- ── LOGOUT CONFIRMATION POPUP ── -->
    <div class="popup" id="confirmLogoutPopup" role="dialog" aria-modal="true" aria-labelledby="dlg-logout-title" aria-hidden="true" style="display:none;">
        <div class="popup-content">
            <p class="popup-title" id="dlg-logout-title">Log Out?</p>
            <p class="popup-sub">Any unsaved data will be lost.</p>
            <button id="confirmLogout" onclick="closeDialog('confirmLogoutPopup'); this.disabled=true; logout().finally(()=>this.disabled=false)">Log Out</button>
            <button id="cancelLogout" onclick="closeDialog('confirmLogoutPopup')">Cancel</button>
        </div>
    </div>

    <!-- ── STORE CONFIRMATION POPUP ── -->
    <div class="popup" id="confirmStorePopup" role="dialog" aria-modal="true" aria-labelledby="dlg-store-title" aria-hidden="true" style="display:none;">
        <div class="popup-content">
            <p class="popup-title" id="dlg-store-title">Store Stock?</p>
            <p class="popup-sub">Make sure all values are correct before saving.</p>
            <button id="confirmStore" onclick="closeDialog('confirmStorePopup'); this.disabled=true; storeStock().finally(()=>this.disabled=false)">Confirm</button>
            <button id="cancelStore" onclick="closeDialog('confirmStorePopup')">Cancel</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script src="../../utils/config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="stock.js"></script>
    <script type="module" src="../../utils/utils.js"></script>
</body>
</html>
