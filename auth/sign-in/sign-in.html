<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="sign-in.css">
</head>
<body>
  <div class="split-page">
    <div class="form-half">
      <div class="auth-brand">
        <div class="auth-brand-icon">RP</div>
        <span class="auth-brand-name">Rapport Pompiste</span>
        <span class="auth-brand-sub">Gas Station Management System</span>
      </div>
      <div class="login-container">
        <h1>Welcome Back</h1>
        <p>Please sign in to your account</p>
        <form id="loginForm">
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>
          <button type="submit" class="login-button">Sign In</button>
        </form>
        <p class="signup-link">Don't have an account? <a href="../sign-up/sign-up">Sign Up</a></p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
  <script>
      const client = new Appwrite.Client()
        .setEndpoint("https://cloud.appwrite.io/v1") 
        .setProject("68a9b3e90029e6a10ff5");

    const account = new Appwrite.Account(client);
    const databases = new Appwrite.Databases(client);

    const databaseId = "695f766c003a8dc2b3be";
    const collectionId = "68c82cf90024f35d491a";

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const id = {
        "izaprinceboaz@gmail.com": "12345",
        "janviern707@gmail.com": "1",
        "nsengumuremyicelestin6@gmail.com": "2",
        "uwimanaabel01@gmail.com": "3",
        "niyitegekaetienne69@gmail.com": "4",
        "kayinamuradavi@gmail.com": "5",
        "emmanuelnayituriki77@gmail.com": "6",
      }
  
      // } else {

      try {
        // Step 1: Login
        await account.createEmailSession(email, password);

        // Step 2: Save employee data immediately
        const data = {
          employeeId: parseInt(id[email]),
          emailAddress: document.getElementById("email").value,
          logDate: new Date().toISOString(), 
        };

        await databases.createDocument(
          databaseId,
          collectionId,
          "unique()", // Appwrite generates an ID
          data
        );

        // Step 3: Check role and redirect
        const adminCollectionId = "68d95af4003245ef87a7";
        const adminCheck = await databases.listDocuments(databaseId, adminCollectionId, [
          Appwrite.Query.equal("email", email)
        ]);

        if (adminCheck.documents.length > 0) {
          window.location.replace("../../pages/report_dashboard/report");
        } else {
          localStorage.setItem("pompisteLoginTime", Date.now());
          window.location.replace("../../index");
        }

      } catch (err) {
        console.error("Error:", err.message);
        alert("Error: " + err.message);
      }      
    });
  </script>
</body>
</html>
