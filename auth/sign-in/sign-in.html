<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Rapport Pompiste</title>
  <link rel="stylesheet" href="sign-in.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231b263b'/><text x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='900' font-size='16' fill='white'>RP</text></svg>">
</head>
<body>
  <div class="split-page">
    <div class="form-half">
      <div class="auth-brand">
        <div class="auth-brand-icon">RP</div>
        <span class="auth-brand-name">Rapport Pompiste</span>
        <span class="auth-brand-sub">Gas Station Management System</span>
      </div>
      <div class="login-container">

        <!-- ── SIGN IN FORM ── -->
        <div id="view-signin">
          <h1>Welcome Back</h1>
          <form id="loginForm">
            <div class="input-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-button">Sign In</button>
          </form>
          <p class="signup-link" style="margin-top:12px;">
            <a href="#" id="forgotLink">Forgot your password?</a>
          </p>
        </div>

        <!-- ── FORGOT PASSWORD FORM ── -->
        <div id="view-forgot" style="display:none;">
          <h1>Reset Password</h1>
          <p>Enter your email address and we'll send you a reset link.</p>
          <form id="forgotForm">
            <div class="input-group">
              <label for="resetEmail">Email</label>
              <input type="email" id="resetEmail" name="resetEmail" required>
            </div>
            <button type="submit" class="login-button">Send Reset Link</button>
          </form>
          <p class="signup-link" style="margin-top:12px;">
            <a href="#" id="backToSignin">← Back to Sign In</a>
          </p>
        </div>

      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
  <script src="../../utils/config.js"></script>
  <script>
    (function () {
      const s = document.createElement("style");
      s.textContent =
        "#toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none}" +
        ".toast{min-width:220px;max-width:360px;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:500;color:#fff;" +
        "box-shadow:0 4px 16px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:auto}" +
        ".toast.show{opacity:1;transform:translateY(0)}" +
        ".toast-success{background:#16a34a}.toast-error{background:#dc2626}.toast-info{background:#2563eb}";
      document.head.appendChild(s);
    })();
    function toast(message, type = "info") {
      let c = document.getElementById("toast-container");
      if (!c) { c = document.createElement("div"); c.id = "toast-container"; document.body.appendChild(c); }
      const el = document.createElement("div");
      el.className = `toast toast-${type}`;
      el.textContent = message;
      c.appendChild(el);
      requestAnimationFrame(() => el.classList.add("show"));
      setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 3500);
    }
  </script>
  <script>
    const _collectionId      = "68c82cf90024f35d491a";
    const _adminCollectionId = "68d95af4003245ef87a7";

    // Redirect already-signed-in users away from the sign-in page
    (async function () {
      try {
        const user       = await _AW.account.get();
        const adminCheck = await _AW.db.listDocuments(_AW.DB_ID, _adminCollectionId, [
          Appwrite.Query.equal("email", user.email)
        ]);
        if (adminCheck.documents.length > 0) {
          window.location.replace("../../pages/situation/situation");
        } else {
          window.location.replace("../../index");
        }
      } catch {
        // Not signed in — stay on this page
      }
    })();

    const _employeeIdMap = {
      "izaprinceboaz@gmail.com": "12345",
      "janviern707@gmail.com": "1",
      "nsengumuremyicelestin6@gmail.com": "2",
      "uwimanaabel01@gmail.com": "3",
      "niyitegekaetienne69@gmail.com": "4",
      "kayinamuradavi@gmail.com": "5",
      "emmanuelnayituriki77@gmail.com": "6",
    };

    // ── SIGN IN ──────────────────────────────────────────────
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;

      const email    = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await _AW.account.createEmailSession(email, password);
      } catch {
        toast("Invalid email or password. Please try again.", "error");
        btn.disabled = false;
        return;
      }

      try {
        const _mappedId = _employeeIdMap[email];
        if (_mappedId !== undefined) {
          try {
            await _AW.db.createDocument(_AW.DB_ID, _collectionId, "unique()", {
              employeeId:   parseInt(_mappedId),
              emailAddress: email,
              logDate:      new Date().toISOString(),
            });
          } catch { /* login-log failure is non-blocking */ }
        }

        const adminCheck = await _AW.db.listDocuments(_AW.DB_ID, _adminCollectionId, [
          Appwrite.Query.equal("email", email)
        ]);

        if (adminCheck.documents.length > 0) {
          window.location.replace("../../pages/situation/situation");
        } else {
          sessionStorage.setItem("pompisteLoginTime", Date.now());
          window.location.replace("../../index");
        }
      } catch (err) {
        toast("Signed in, but could not load your profile. Try refreshing.", "error");
        btn.disabled = false;
      }
    });

    // ── FORGOT PASSWORD ───────────────────────────────────────
    // Uses Appwrite's built-in recovery flow:
    //   1. createRecovery() emails the user a link containing userId + secret
    //   2. The link opens reset-password.html, which calls updateRecovery()
    //
    // IMPORTANT: The reset URL below must be whitelisted in:
    //   Appwrite Console → Auth → Security → Allowed password reset URLs
    document.getElementById("forgotLink").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("view-signin").style.display  = "none";
      document.getElementById("view-forgot").style.display  = "block";
    });

    document.getElementById("backToSignin").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("view-forgot").style.display  = "none";
      document.getElementById("view-signin").style.display  = "block";
    });

    document.getElementById("forgotForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn   = this.querySelector('button[type="submit"]');
      btn.disabled = true;

      const email    = document.getElementById("resetEmail").value.trim();
      const resetUrl = `${window.location.origin}/testing_projects/auth/reset-password/reset-password`;

      try {
        await _AW.account.createRecovery(email, resetUrl);
        toast("Reset link sent — check your email.", "success");
        // Switch back to sign-in after a moment
        setTimeout(() => {
          document.getElementById("view-forgot").style.display = "none";
          document.getElementById("view-signin").style.display = "block";
        }, 2000);
      } catch {
        toast("Could not send reset link. Check the email address and try again.", "error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
