<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Page</title>
  <link rel="stylesheet" href="sign-up.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231b263b'/><text x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='900' font-size='16' fill='white'>RP</text></svg>">
</head>
<body>
  <div class="split-page">
    <div class="form-half">
      <div class="auth-brand">
        <div class="auth-brand-icon">RP</div>
        <span class="auth-brand-name">Rapport Pompiste</span>
        <span class="auth-brand-sub">Gas Station Management System</span>
      </div>
      <div class="login-container">
        <h1>Welcome</h1>
        <p>Please sign in to your account</p>
        <form id="signupForm">
          <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="input-group">
            <label for="employeeId">Employee ID</label>
            <input type="number" id="employeeId" name="employeeId" min="1" required>
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" title="At least 8 characters" required>
          </div>

          <button type="submit" class="login-button">Sign Up</button>
        </form>
        <p class="signup-link">Already have an account? <a href="../sign-in/sign-in">Sign In</a></p>
      </div>
    </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
  <script src="../../utils/config.js"></script>
  <script>
    (function () {
      const s = document.createElement("style");
      s.textContent =
        "#toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none}" +
        ".toast{min-width:220px;max-width:360px;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:500;color:#fff;" +
        "box-shadow:0 4px 16px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:auto}" +
        ".toast.show{opacity:1;transform:translateY(0)}" +
        ".toast-error{background:#dc2626}.toast-info{background:#2563eb}";
      document.head.appendChild(s);
    })();
    function toast(message, type = "info") {
      let c = document.getElementById("toast-container");
      if (!c) { c = document.createElement("div"); c.id = "toast-container"; document.body.appendChild(c); }
      const el = document.createElement("div");
      el.className = `toast toast-${type}`;
      el.textContent = message;
      c.appendChild(el);
      requestAnimationFrame(() => el.classList.add("show"));
      setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 3500);
    }
  </script>
  <script>
    const _collectionId = "68c82cf90024f35d491a";

    document.getElementById("signupForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;

      const name       = document.getElementById("name").value;
      const employeeId = document.getElementById("employeeId").value;
      const email      = document.getElementById("email").value;
      const password   = document.getElementById("password").value;

      try {
        await _AW.account.create("unique()", email, password, name);
        await _AW.account.createEmailSession(email, password);

        await _AW.db.createDocument(_AW.DB_ID, _collectionId, "unique()", {
          employeeId:   parseInt(employeeId),
          emailAddress: email,
          logDate:      new Date().toISOString(),
        });

        window.location.href = "../../index";

      } catch (error) {
        console.error("Sign-up error:", error);
        toast(error.message || "Sign up failed. Please try again.", "error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
