<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="root/homepage.css">
    <title>Rapport Pompiste</title>
</head>
<body>

    <!-- ── HEADER ── -->
    <header class="site-header">
        <div class="header-brand">
            <div class="brand-icon">RP</div>
            <div>
                <div class="brand-title">Rapport Pompiste</div>
                <div class="brand-sub" id="welcomeMessage"></div>
            </div>
        </div>
        <div class="fuel-prices">
            <p>ESSENCE: <span id="pmsPrice">—</span></p>
            <p>MAZOUT: <span id="agoPrice">—</span></p>
        </div>
    </header>

    <!-- ── NAV ── -->
    <nav>
      <ul>
        <li><a href="index">Rapport</a></li>
      </ul>
    </nav>

    <!-- ── SHIFT BAR ── -->
    <div class="shift-bar">
        <div class="shift-field">
            <label for="logDate">Date</label>
            <input type="date" name="logDate" id="logDate">
        </div>
        <div class="shift-field">
            <label for="shift">Shift</label>
            <select id="shift">
                <option value=""></option>
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening">Evening</option>
                <option value="Night">Night</option>
            </select>
        </div>
        <p><span id="status"></span></p>
    </div>

    <!-- ── MAIN FORMS ── -->
    <div class="forms-container">

        <!-- LEFT: PUMP INDEX -->
        <div class="form-side">
            <div class="section-title">Pump Index</div>
            <form action="" id="rapportForm">

                <!-- PMS / Essence -->
                <div class="fuel-group pms-group">
                    <div class="fuel-group-label">Essence (PMS) — Pumps P1 &amp; P2</div>
                    <div class="pump-row">
                        <span class="pump-id">P1</span>
                        <label>Start</label>
                        <input type="number" name="pms" id="pms1">
                        <label>End</label>
                        <input type="number" name="pms" id="pms2">
                    </div>
                    <div class="pump-row">
                        <span class="pump-id">P2</span>
                        <label>Start</label>
                        <input type="number" name="pms" id="pms3">
                        <label>End</label>
                        <input type="number" name="pms" id="pms4">
                    </div>
                </div>

                <!-- AGO / Mazout -->
                <div class="fuel-group ago-group">
                    <div class="fuel-group-label">Mazout (AGO) — Pumps P3 &amp; P4</div>
                    <div class="pump-row">
                        <span class="pump-id">P3</span>
                        <label>Start</label>
                        <input type="number" name="ago" id="ago1">
                        <label>End</label>
                        <input type="number" name="ago" id="ago2">
                    </div>
                    <div class="pump-row">
                        <span class="pump-id">P4</span>
                        <label>Start</label>
                        <input type="number" name="ago" id="ago3">
                        <label>End</label>
                        <input type="number" name="ago" id="ago4">
                    </div>
                </div>

            </form>

            <div style="padding: 0 16px 12px;">
                <button class="action-btn" onclick="this.disabled=true; calculateIndex().finally(() => this.disabled=false)">Calculate Index</button>
            </div>

            <div class="result-cards">
                <div class="result-card pms-card">
                    <div class="result-label">PMS Sales</div>
                    <div class="result-value output" id="resultpms">—</div>
                </div>
                <div class="result-card ago-card">
                    <div class="result-label">AGO Sales</div>
                    <div class="result-value output" id="resultago">—</div>
                </div>
                <div class="result-card total-card">
                    <div class="result-label">Total Vente</div>
                    <div class="result-value output" id="result">—</div>
                </div>
            </div>
        </div>

        <!-- RIGHT: PAYMENTS -->
        <div class="form-side">
            <div class="section-title">Payments</div>
            <form action="" id="paymentsForm">

                <div class="payment-rows">
                    <div class="pay-input-row">
                        <label for="momo">MoMo</label>
                        <input type="number" name="momo" id="momo" onchange="MomoLoss()">
                    </div>
                    <div class="pay-input-row">
                        <label for="momoLoss">MoMo Loss</label>
                        <input type="number" name="momoLoss" id="momoLoss">
                        <span id="tempMomoLoss" class="hint-span" data-original="&nbsp;&nbsp;RWF"></span>&nbsp;RWF
                    </div>
                    <div class="pay-input-row">
                        <label for="spFuelCard">SP Fuel Card</label>
                        <input type="text" name="spFuelCard" id="spFuelCard" placeholder="e.g. 10000,10000">
                    </div>
                    <div class="pay-input-row">
                        <label for="bon">Bon</label>
                        <input type="number" name="bon" id="bon">
                    </div>
                    <div class="pay-input-row">
                        <label for="bankCard">Bank Card</label>
                        <input type="text" name="bankCard" id="bankCard" placeholder="e.g. 10000,10000">
                    </div>
                </div>

                <!-- Bulletage / Cash -->
                <div class="cash-section">
                    <div class="cash-section-title">Cash (Bulletage)</div>
                    <div class="cash-grid">
                        <div class="cash-denom">
                            <label>5,000 &times;</label>
                            <input type="number" name="cash5000" id="5000">
                        </div>
                        <div class="cash-denom">
                            <label>2,000 &times;</label>
                            <input type="number" name="cash2000" id="2000">
                        </div>
                        <div class="cash-denom">
                            <label>1,000 &times;</label>
                            <input type="number" name="cash1000" id="1000">
                        </div>
                        <div class="cash-denom">
                            <label>500 &times;</label>
                            <input type="number" name="cash500" id="500">
                        </div>
                    </div>
                    <div class="cash-total">
                        <span>Total Cash</span>
                        <span class="output" id="totalCash">—</span>
                    </div>
                </div>

                <!-- Fiche & Loans -->
                <div class="fiche-loan-section">
                    <button class="action-btn btn-secondary" type="button" onclick="this.disabled=true; addFiche().finally(() => this.disabled=false)">+ Add Fiche</button>
                    <span class="fiche-total">Fiche: <span id="totalFiche" class="output">—</span></span>
                    <div id="ficheContainer"></div>

                    <button class="action-btn btn-secondary" type="button" style="margin-top:8px;" onclick="this.disabled=true; addLoan().finally(() => this.disabled=false)">+ Add Loan</button>
                    <span class="loan-total">Loans: <span id="totalLoans" class="output">—</span></span>
                    <div id="loanContainer"></div>
                </div>

            </form>

            <div style="padding: 0 16px 12px;">
                <button class="action-btn" onclick="this.disabled=true; payments().finally(() => this.disabled=false)">Calculate Payments</button>
            </div>

            <div class="result-cards">
                <div class="result-card total-card">
                    <div class="result-label">Total Payments</div>
                    <div class="result-value output" id="totalPayments">—</div>
                </div>
                <div class="result-card gain-card">
                    <div class="result-label">Gain / Loss</div>
                    <div class="result-value output" id="gainPayments">—</div>
                </div>
            </div>
        </div>

    </div>

    <!-- ── STORE REPORT ── -->
    <div class="store-bar">
        <button class="action-btn btn-store" onclick="this.disabled=true; situation().finally(() => this.disabled=false)">Store Report</button>
    </div>

    <footer>
        <button class="action-btn btn-logout" onclick="this.disabled=true; logout().finally(() => this.disabled=false)">Log Out</button>
    </footer>

    <script src="root/index.js"></script>
    <script type="module" src="utils/utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
</body>
</html>
